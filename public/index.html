<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Estoque</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<header class="border-b border-slate-800 bg-slate-900/80"><div class="mx-auto max-w-6xl px-6 py-5 flex items-center justify-between"><div><p class="text-violet-400 text-sm font-semibold">PROJETO INTEGRADOR</p><h1 class="text-2xl font-bold">Controle de Estoque</h1></div><span class="rounded-full bg-violet-950 px-3 py-1 text-xs text-violet-300">Painel administrativo</span></div></header>
<main class="mx-auto max-w-6xl px-6 py-8">
<section class="grid gap-4 sm:grid-cols-3 mb-8">
<div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-slate-400 text-sm">Produtos cadastrados</p><p id="total" class="text-3xl font-bold mt-2">0</p></div>
<div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-slate-400 text-sm">Unidades em estoque</p><p id="units" class="text-3xl font-bold mt-2">0</p></div>
<div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-slate-400 text-sm">Abaixo do mínimo</p><p id="low" class="text-3xl font-bold mt-2">0</p></div>
</section>
<section class="rounded-2xl border border-slate-800 bg-slate-900 p-6 mb-8"><h2 class="text-lg font-semibold mb-4">Cadastrar produto</h2>
<form id="productForm" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
<input name="name" required placeholder="Nome do produto" class="rounded-lg bg-slate-800 p-3"><input name="sku" required placeholder="Código / SKU" class="rounded-lg bg-slate-800 p-3"><input name="category" required placeholder="Categoria" class="rounded-lg bg-slate-800 p-3">
<input name="quantity" type="number" min="0" value="0" placeholder="Quantidade inicial" class="rounded-lg bg-slate-800 p-3"><input name="min_quantity" type="number" min="0" value="5" placeholder="Estoque mínimo" class="rounded-lg bg-slate-800 p-3"><input name="unit_price" type="number" min="0" step="0.01" value="0" placeholder="Preço unitário (R$)" class="rounded-lg bg-slate-800 p-3">
<button class="rounded-lg bg-violet-500 px-5 py-3 font-bold text-white hover:bg-violet-400 sm:col-span-2 lg:col-span-3">Adicionar produto</button></form><p id="message" class="mt-3 text-sm text-amber-300"></p></section>
<section class="rounded-2xl border border-slate-800 bg-slate-900 p-6 mb-8"><div class="flex flex-wrap justify-between gap-3 mb-4"><h2 class="text-lg font-semibold">Produtos</h2><input id="search" placeholder="Buscar produto..." class="rounded-lg bg-slate-800 px-3 py-2 text-sm"></div>
<div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="text-slate-400 border-b border-slate-700"><tr><th class="p-3">Produto</th><th class="p-3">Categoria</th><th class="p-3">Quantidade</th><th class="p-3">Preço</th><th class="p-3">Movimentar</th><th class="p-3">Ação</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><h2 class="text-lg font-semibold mb-4">Movimentações recentes</h2><div id="movements" class="space-y-2 text-sm text-slate-300">Carregando...</div></section>
</main>
<script>
let products=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 const [p,m]=await Promise.all([fetch('/api/products').then(r=>r.json()),fetch('/api/movements').then(r=>r.json())]); products=p;
 $('#total').textContent=p.length; $('#units').textContent=p.reduce((a,x)=>a+Number(x.quantity),0);
 $('#low').textContent=p.filter(x=>Number(x.quantity)<=Number(x.min_quantity)).length; render();
 $('#movements').innerHTML=m.map(x=>`<div class="flex justify-between gap-3 border-b border-slate-800 py-2"><span>${esc(x.product_name)} <span class="text-slate-500">(${esc(x.sku)})</span></span><span class="${x.movement_type==='entrada'?'text-emerald-300':'text-rose-300'}">${x.movement_type==='entrada'?'+':'−'}${x.quantity} · ${new Date(x.created_at).toLocaleString('pt-BR')}</span></div>`).join('')||'Nenhuma movimentação registrada.';
}
function render(){
 const q=$('#search').value.toLowerCase();
 $('#rows').innerHTML=products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q)).map(p=>`<tr class="border-b border-slate-800">
 <td class="p-3"><b>${esc(p.name)}</b><div class="text-slate-400">${esc(p.sku)}</div></td><td class="p-3">${esc(p.category)}</td>
 <td class="p-3"><span class="${Number(p.quantity)<=Number(p.min_quantity)?'text-amber-300':''}">${p.quantity}</span><div class="text-xs text-slate-500">mínimo: ${p.min_quantity}</div></td>
 <td class="p-3">R$ ${Number(p.unit_price).toFixed(2).replace('.',',')}</td>
 <td class="p-3"><div class="flex gap-2"><button onclick="moveStock(${p.id},'entrada')" class="text-emerald-300">+ Entrada</button><button onclick="moveStock(${p.id},'saida')" class="text-amber-300">− Saída</button></div></td>
 <td class="p-3"><button onclick="removeProduct(${p.id})" class="text-rose-300">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6" class="p-6 text-center text-slate-400">Nenhum produto encontrado.</td></tr>';
}
$('#productForm').addEventListener('submit',async e=>{
 e.preventDefault(); const d=Object.fromEntries(new FormData(e.target)); ['quantity','min_quantity','unit_price'].forEach(k=>d[k]=Number(d[k]));
 const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}); const out=await r.json().catch(()=>({}));
 if(!r.ok){$('#message').textContent=out.error||'Erro ao cadastrar.';return;}
 $('#message').textContent='Produto cadastrado.';e.target.reset();await load();
});
async function moveStock(id,type){
 const raw=prompt(`Quantidade para ${type==='entrada'?'entrada':'saída'}:`); if(raw===null)return;
 const quantity=Number(raw); if(!Number.isInteger(quantity)||quantity<=0){alert('Informe uma quantidade inteira maior que zero.');return;}
 const note=prompt('Observação (opcional):')||'';
 const r=await fetch(`/api/products/${id}/movements`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,quantity,note})});
 const out=await r.json().catch(()=>({})); if(!r.ok){alert(out.error||'Erro na movimentação.');return;} await load();
}
async function removeProduct(id){if(!confirm('Excluir produto e seu histórico de movimentações?'))return;const r=await fetch('/api/products/'+id,{method:'DELETE'});if(!r.ok)alert('Não foi possível excluir.');await load();}
$('#search').addEventListener('input',render);
load().catch(()=>$('#message').textContent='Erro ao carregar. Confira servidor e PostgreSQL.');
</script></body></html>
